[project]
name = "so-ell"
version = "1.0.0"
description = "Which kinds of interactive-ebook practice line up with midterm scores? A reproducible analysis of 19.8M Runestone events."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "pandera>=0.20",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
app = ["streamlit>=1.36", "plotly>=5.22"]
tracking = ["mlflow>=2.14"]
orchestration = [
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "markdown>=3.6",
    "ipywidgets>=8.1.9",
]

[project.scripts]
so-ell = "so_ell.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so_ell"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
# Notebooks are generated by notebooks/build_notebooks.py, which is linted.
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.dagster]
module_name = "so_ell.orchestration"
